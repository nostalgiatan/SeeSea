commands = [
    {
        name = "install_python_packages",
        description = "Install Python packages using pip",
        program = "pip",
        args = ["install", "seesea", "seesea-core"],
        working_dir = ".",
        background = false,
        ignore_errors = false
    }
]

[project]
name = "SeeSea"
version = "1.0.0"
description = "Privacy-focused metasearch engine"
author = "SeeSea Team"

[install_options]
default_dir = "/opt/seesea"
create_desktop_shortcut = true
create_start_menu_shortcut = true
add_to_path = true
create_uninstaller = true
silent = false
create_service = false
auto_check_updates = true
backup_enabled = true

platform.windows_default_dir = "C:\\Program Files\\SeeSea"
platform.linux_default_dir = "/opt/seesea"
platform.macos_default_dir = "/Applications/SeeSea"