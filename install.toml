commands = []

[project]
name = "SeeSea"
version = "1.0.0"
description = "Privacy-focused metasearch engine"
author = "SeeSea Team"

[install_options]
default_dir = "/opt/seesea"
create_desktop_shortcut = true
create_start_menu_shortcut = true
add_to_path = true
create_uninstaller = true
silent = false
create_service = false
auto_check_updates = true
backup_enabled = true

platform.windows_default_dir = "C:\\Program Files\\SeeSea"
platform.linux_default_dir = "/opt/seesea"
platform.macos_default_dir = "/Applications/SeeSea"

[[dependencies]]
name = "playwright"
version = "^1.40.0"
kind = "runtime"
optional = false

[[dependencies]]
name = "rich"
version = "^13.0.0"
kind = "runtime"
optional = false

[[dependencies]]
name = "click"
version = "^8.0.0"
kind = "runtime"
optional = false

[[dependencies]]
name = "typing-extensions"
version = "^4.0.0"
kind = "runtime"
optional = false