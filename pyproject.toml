[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "seesea-core"
version = "2.0.4"
description = "SeeSea Rust core module - High-performance privacy-focused data aggregation platform"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0-or-later"}
keywords = ["search", "metasearch", "privacy", "rust", "rss", "hot-trends", "ai", "vector-database"]
authors = [
    {name = "SeeSea Team", email = "nostalgiatan@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
browser = [
    "playwright>=1.40.0",
]
full = [
    "playwright>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/nostalgiatan/SeeSea"
Repository = "https://github.com/nostalgiatan/SeeSea"
Documentation = "https://github.com/nostalengan/SeeSea/blob/main/docs"


[tool.maturin]
features = ["python"]
module-name = "seesea_core"
include = [
    "rss/template/*.see",  # RSS模板文件
    "static/html/*",
    "static/html/**/*"
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
exclude = "build"

[tool.ruff]
line-length = 100
target-version = "py38"
