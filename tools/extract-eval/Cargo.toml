[package]
name = "extract-eval"
version = "0.1.0"
edition = "2021"
description = "Evaluation harness for HTML main-content extractors (WCXB format)"
publish = false

[dependencies]
seesea-extract = { path = "../../seesea-core/crates/seesea-extract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
rayon = "1"
scraper = "0.24"
ego-tree = "0.10"
gbdt = "0.1"
# Baseline: firecrawl/html-extractor, pinned.
html-extractor = { git = "https://github.com/firecrawl/html-extractor", rev = "0a2b743" }
rs-trafilatura = "0.2.2"
forust-ml = "0.8.0"

[profile.release]
opt-level = 3

# Standalone project; do not join the seesea-core workspace.
[workspace]
