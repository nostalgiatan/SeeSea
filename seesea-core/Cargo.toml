# SeeSea: a search data center for AI. The `seesea` CLI lives in crates/seesea-cli.
[workspace]
members = [
    "crates/seesea-derive",
    "crates/seesea-errors",
    "crates/seesea-net",
    "crates/seesea-config",
    "crates/seesea-cache",
    "crates/seesea-search",
    "crates/seesea-sys",
    "crates/seesea-cleaner",
    "crates/seesea-extract",
    "crates/seesea-fetch",
    "crates/seesea-pipeline",
    "crates/seesea-mcp",
    "crates/seesea-cli",
    "crates/seesea-embed",
    "crates/seesea-auth",
    "crates/error",
    "crates/error-derive",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
