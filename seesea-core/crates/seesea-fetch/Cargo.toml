[package]
name = "seesea-fetch"
version = "0.1.0"
edition = "2024"
description = "Fetch a page for extraction: target validation, size cap, redirect re-check"
license = "AGPL-3.0-or-later"

[dependencies]
seesea-net = { path = "../seesea-net" }
url = "2"

[dev-dependencies]
seesea-extract = { path = "../seesea-extract", default-features = false }
tokio = { version = "1", features = ["full"] }
