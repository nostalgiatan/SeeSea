[package]
name = "seesea-extract"
version = "0.1.0"
edition = "2024"
description = "Main-content extraction: block segmentation, a gradient-boosted block classifier and order-preserving Markdown output"
license = "AGPL-3.0-or-later"

[dependencies]
scraper = "0.24.0"
ego-tree = "0.10"
forust-ml = "0.8.0"
flate2 = "1"
rayon = { version = "1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[features]
default = ["parallel"]
# `Extractor::extract_batch` spreads pages over a rayon pool
parallel = ["dep:rayon"]
