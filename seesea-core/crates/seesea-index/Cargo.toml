[package]
name = "seesea-index"
version = "3.0.0"
edition = "2024"
description = "Local fresh-news index: per-day SQLite shards, feed polling and discovery"
license = "AGPL-3.0-or-later"

[dependencies]
seesea-pipeline = { path = "../seesea-pipeline" }
seesea-fetch = { path = "../seesea-fetch" }
async-trait = "0.1.89"
chrono = "0.4.42"
futures = "0.3.31"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.24.0"
seesea-extract = { path = "../seesea-extract", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rand = "0.9"
hex = "0.4"
tokio = { version = "1.48.0", features = ["time", "rt", "sync"] }
url = "2.5.7"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["full"] }
