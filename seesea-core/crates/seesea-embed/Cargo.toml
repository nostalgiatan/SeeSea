[package]
name = "seesea-embed"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust text embeddings: BERT-style sentence encoders on candle"
license = "AGPL-3.0-or-later"

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
rayon = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"

[dev-dependencies]
tempfile = "3.23.0"
