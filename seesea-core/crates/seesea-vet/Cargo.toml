[package]
name = "seesea-vet"
version = "3.0.0"
edition = "2024"
description = "Judges a result URL before it is read: popularity tier, official sites, phishing signals and threat lists, all offline"
license = "AGPL-3.0-or-later"

[dependencies]
idna = "1.1.0"
psl = "2.1.184"
serde = { version = "1.0.228", features = ["derive"] }
unicode-script = "0.5.8"
url = "2.5.7"

[dev-dependencies]
serde_json = "1.0.145"
tempfile = "3.23.0"
