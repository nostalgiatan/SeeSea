[package]
name = "seesea-pipeline"
version = "0.1.0"
edition = "2024"
description = "Search pipeline: fan-out, fusion, ranking, content fetch and extraction, reranking, section selection"
license = "AGPL-3.0-or-later"

[dependencies]
seesea-extract = { path = "../seesea-extract", default-features = false }
seesea-fetch = { path = "../seesea-fetch" }
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"
tokio = { version = "1.48.0", features = ["time", "rt", "sync", "macros", "fs"] }
url = "2.5.7"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tempfile = "3.23.0"
