[mypy]
# Ignore missing type stubs
ignore_missing_imports = True
# Skip following imports to untyped modules
follow_imports = skip
# Allow Any type in certain cases
allow_any_unimported = True
allow_any_expr = True
allow_any_decorated = True

# Ignore specific modules
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-markitdown.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-seesea_core.*]
ignore_missing_imports = True

[mypy-tf.*]
ignore_missing_imports = True

[mypy-tf_rust.*]
ignore_missing_imports = True
