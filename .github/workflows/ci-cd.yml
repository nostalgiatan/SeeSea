name: CI/CD Pipeline

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.platform }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x64 builds for Python 3.10-3.12
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.10'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.11'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.12'
          # Linux arm64 builds for Python 3.10-3.12
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            python-version: '3.10'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            python-version: '3.11'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            python-version: '3.12'
          # Linux armv7 builds for Python 3.10-3.12
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            python-version: '3.10'
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            python-version: '3.11'
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            python-version: '3.12'
          # Windows x64 builds for Python 3.10-3.12
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.10'
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.11'
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.12'
          # Windows arm64 builds for Python 3.10-3.12
          - os: windows-latest
            platform: windows
            arch: arm64
            python-version: '3.10'
          - os: windows-latest
            platform: windows
            arch: arm64
            python-version: '3.11'
          - os: windows-latest
            platform: windows
            arch: arm64
            python-version: '3.12'
          # macOS x64 builds for Python 3.10-3.12
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.10'
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.11'
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.12'
          # macOS arm64 builds for Python 3.10-3.12
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.10'
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.11'
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.12'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin setuptools wheel build

    - name: Build seesea-core with maturin
      shell: bash
      run: |
        # 直接在主目录构建，不使用工作区
        maturin build --release --strip
        mkdir -p building
        cp target/wheels/*.whl building/

    - name: Build seesea Python package
      working-directory: ./seesea
      shell: bash
      run: |
        python -m pip install -e .
        python -m build --wheel
        cp dist/*.whl ../building/

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jinja2 zstandard

    - name: Generate installation scripts
      run: |
        python build.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: seesea-${{ matrix.platform }}-${{ matrix.arch }}-py${{ matrix.python-version }}
        path: building/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: building

    - name: List Release Files
      run: ls -la building/**/*

    - name: Move Files to Root of Building Directory
      run: |
        # 移动所有子目录中的文件到building根目录
        for dir in building/*; do
          if [ -d "$dir" ]; then
            mv "$dir"/* building/
            rmdir "$dir"
          fi
        done
        ls -la building/

    - name: Install build dependencies for generating seesea-up.py
      run: |
        python -m pip install --upgrade pip
        pip install jinja2 zstandard

    - name: Generate seesea-up.py with actual platform information
      run: |
        python build.py -up
        ls -la building/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          building/*.whl
          building/*.py
        draft: false
        prerelease: false
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Rust Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Run Clippy
      run: |
        cargo clippy --manifest-path Cargo.toml -- -D warnings

    - name: Run Rustfmt
      run: |
        cargo fmt --manifest-path Cargo.toml --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run Security Audit
      run: |
        cargo audit --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2025-0119

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy
        pip install types-requests types-openpyxl types-xlrd types-defusedxml
        pip install numpy

    - name: Run Black
      working-directory: ./seesea
      run: black --check .

    - name: Run Ruff
      working-directory: ./seesea
      run: ruff check .

    - name: Run Mypy
      working-directory: ./seesea
      run: mypy .
