name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.platform }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds for Python 3.9-3.12
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.9'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.10'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.11'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.12'
          # Windows builds for Python 3.9-3.12
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.9'
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.10'
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.11'
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.12'
          # macOS x64 builds for Python 3.9-3.12
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.9'
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.10'
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.11'
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.12'
          # macOS arm64 builds for Python 3.9-3.12
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.9'
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.10'
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.11'
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.12'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin setuptools wheel build

    - name: Build seesea-core with maturin
      shell: bash
      run: |
        # 直接在主目录构建，不使用工作区
        maturin build --release --strip
        mkdir -p building
        cp target/wheels/*.whl building/

    - name: Build seesea Python package
      working-directory: ./seesea
      shell: bash
      run: |
        python -m pip install -e .
        python -m build --wheel
        cp dist/*.whl ../building/

    - name: Copy install.toml to building directory
      shell: bash
      run: |
        cp install.toml building/

    - name: Build installer with cargo packager
      working-directory: ./installer
      shell: bash
      run: |
        # 安装cargo-packager
        cargo install cargo-packager
        # 确保两个whl文件就位后再构建installer
        ls -la ../building/
        # 先构建installer可执行文件
        cargo build --release
        # 检查可执行文件是否生成
        ls -la target/release/
        # 然后使用cargo packager打包installer
        cargo packager --release --manifest-path Cargo.toml
        # 清理不需要的产物
        if [ "${{ matrix.platform }}" = "linux" ]; then
          # Linux只保留deb包
          find target/release -name "*.AppImage" -delete
          find target/release -name "*.tar.gz" -delete
        elif [ "${{ matrix.platform }}" = "windows" ]; then
          # Windows只保留exe安装程序
          find target/release -name "*.zip" -delete
        elif [ "${{ matrix.platform }}" = "macos" ]; then
          # macOS只保留dmg镜像
          find target/release -name "*.zip" -delete
        fi

    # Rename Windows installer
    - name: Rename Windows installer
      if: matrix.platform == 'windows'
      run: |
        # Remove dot from Python version (e.g., py3.9 -> py39)
        $PYTHON_VERSION_NO_DOT = "${{ matrix.python-version }}".Replace(".", "")
        # Check if target/release directory exists
        if (Test-Path -Path "./installer/target/release/") {
          # List available files for debugging
          Get-ChildItem -Path "./installer/target/release/"
          
          # 查找并重命名exe安装程序，使用更灵活的匹配
          $EXE_FILE = Get-ChildItem -Path "./installer/target/release/" -Name "*.exe" | Select-Object -First 1
          if ($EXE_FILE) {
            Move-Item -Path "./installer/target/release/$EXE_FILE" -Destination "./building/seesea-installer_1.0.0_py$PYTHON_VERSION_NO_DOT_${{ matrix.platform }}_${{ matrix.arch }}-setup.exe"
          }
        } else {
          Write-Host "target/release directory not found, skipping rename"
          # List available directories for debugging
          Get-ChildItem -Path "./installer/"
        }

    # Rename Linux installer
    - name: Rename Linux installer
      if: matrix.platform == 'linux'
      run: |
        # Remove dot from Python version (e.g., py3.9 -> py39)
        PYTHON_VERSION_NO_DOT=$(echo "${{ matrix.python-version }}" | tr -d '.')
        # Check if target/release directory exists
        if [ -d "./installer/target/release/" ]; then
          # List available files for debugging
          ls -la ./installer/target/release/
          
          # 查找并重命名deb包，使用更灵活的匹配
          DEB_FILE=$(find ./installer/target/release/ -name "*.deb" | head -1)
          if [ -n "$DEB_FILE" ]; then
            mv "$DEB_FILE" "./building/seesea-installer_1.0.0_py$PYTHON_VERSION_NO_DOT_${{ matrix.platform }}_${{ matrix.arch }}.deb"
          fi
        else
          echo "target/release directory not found, skipping rename"
          # List available directories for debugging
          ls -la ./installer/
        fi

    # Rename macOS installer
    - name: Rename macOS installer
      if: matrix.platform == 'macos'
      run: |
        # Remove dot from Python version (e.g., py3.9 -> py39)
        PYTHON_VERSION_NO_DOT=$(echo "${{ matrix.python-version }}" | tr -d '.')
        # Check if target/release directory exists
        if [ -d "./installer/target/release/" ]; then
          # List available files for debugging
          ls -la ./installer/target/release/
          
          # 查找并重命名dmg镜像，使用更灵活的匹配
          DMG_FILE=$(find ./installer/target/release/ -name "*.dmg" | head -1)
          if [ -n "$DMG_FILE" ]; then
            mv "$DMG_FILE" "./building/seesea-installer_1.0.0_py$PYTHON_VERSION_NO_DOT_${{ matrix.platform }}_${{ matrix.arch }}.dmg"
          fi
        else
          echo "target/release directory not found, skipping rename"
          # List available directories for debugging
          ls -la ./installer/
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: seesea-${{ matrix.platform }}-${{ matrix.arch }}-py${{ matrix.python-version }}
        path: building/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: building

    - name: List Release Files
      run: ls -la building/**/*

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          building/**/*
        draft: false
        prerelease: false
        body: |
          ## SeeSea Release
          
          This release includes:
          - seesea Python package wheel
          - seesea-core native wheel for various platforms and Python versions
          - Self-contained installer with Python version support
          - Configuration files
          
          ### Supported Platforms
          - Linux x64
          - Windows x64
          - macOS x64
          - macOS arm64
          
          ### Supported Python Versions
          - Python 3.9
          - Python 3.10
          - Python 3.11
          - Python 3.12
          
          ### Installation
          ```bash
          # Using pip
          pip install seesea seesea-core
          
          # Using installer
          # Download the appropriate installer for your platform and Python version
          # e.g., seesea-installer_1.0.0_py3.12_x64-setup.exe for Windows with Python 3.12
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Rust Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Run Clippy
      run: |
        # 直接在主目录运行 clippy，不使用工作区
        cargo clippy --manifest-path Cargo.toml -- -D warnings

    - name: Run Rustfmt
      run: |
        # 直接在主目录运行 rustfmt，不使用工作区
        cargo fmt --manifest-path Cargo.toml --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run Security Audit
      run: |
        # 直接在主目录运行 audit，不使用工作区
        # 忽略未维护的crate警告，只关注安全漏洞
        cargo audit --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2025-0119

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy

    - name: Run Black
      working-directory: ./seesea
      run: black --check .

    - name: Run Ruff
      working-directory: ./seesea
      run: ruff check .

    - name: Run Mypy
      working-directory: ./seesea
      run: mypy .
