name: CI/CD Pipeline

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.platform }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x64 builds for Python 3.9-3.12
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.9'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.10'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.11'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            python-version: '3.12'
          # Linux arm64 builds for Python 3.9-3.12
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            python-version: '3.9'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            python-version: '3.10'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            python-version: '3.11'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            python-version: '3.12'
          # Linux armv7 builds for Python 3.9-3.12
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            python-version: '3.9'
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            python-version: '3.10'
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            python-version: '3.11'
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            python-version: '3.12'
          # Windows x64 builds for Python 3.9-3.12
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.9'
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.10'
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.11'
          - os: windows-latest
            platform: windows
            arch: x64
            python-version: '3.12'
          # Windows arm64 builds for Python 3.9-3.12
          - os: windows-latest
            platform: windows
            arch: arm64
            python-version: '3.9'
          - os: windows-latest
            platform: windows
            arch: arm64
            python-version: '3.10'
          - os: windows-latest
            platform: windows
            arch: arm64
            python-version: '3.11'
          - os: windows-latest
            platform: windows
            arch: arm64
            python-version: '3.12'
          # macOS x64 builds for Python 3.9-3.12
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.9'
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.10'
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.11'
          - os: macos-latest
            platform: macos
            arch: x64
            python-version: '3.12'
          # macOS arm64 builds for Python 3.9-3.12
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.9'
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.10'
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.11'
          - os: macos-latest
            platform: macos
            arch: arm64
            python-version: '3.12'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin setuptools wheel build

    - name: Build seesea-core with maturin
      shell: bash
      run: |
        # 直接在主目录构建，不使用工作区
        maturin build --release --strip
        mkdir -p building
        cp target/wheels/*.whl building/

    - name: Build seesea Python package
      working-directory: ./seesea
      shell: bash
      run: |
        python -m pip install -e .
        python -m build --wheel
        cp dist/*.whl ../building/

    - name: Build markitdown Python package
      working-directory: ./crates/markitdown
      shell: bash
      run: |
        python -m pip install -e .
        python -m build --wheel
        cp dist/*.whl ../../building/

    - name: Build tf_rust Python package
      working-directory: ./crates/tf
      shell: bash
      run: |
        python -m pip install -e .
        maturin build --release --strip
        cp target/wheels/*.whl ../../building/

    - name: Build tf Python package
      working-directory: ./crates/tf/tf
      shell: bash
      run: |
        python -m pip install -e .
        python -m build --wheel
        cp dist/*.whl ../../../building/

    - name: Copy install.toml to building directory
      shell: bash
      run: |
        cp install.toml building/

    - name: Build installer with cargo packager
      working-directory: ./installer
      shell: bash
      run: |
        # 安装cargo-packager
        cargo install cargo-packager
        # 确保两个whl文件就位后再构建installer
        ls -la ../building/
        # 先构建installer可执行文件
        cargo build --release
        # 检查可执行文件是否生成
        ls -la target/release/
        # 然后使用cargo packager打包installer，指定产物类型
        if [ "${{ matrix.platform }}" = "linux" ]; then
          # Linux生成deb包
          cargo packager --release --manifest-path Cargo.toml --formats deb
        elif [ "${{ matrix.platform }}" = "windows" ]; then
          # Windows生成NSIS安装程序
          cargo packager --release --manifest-path Cargo.toml --formats nsis
        elif [ "${{ matrix.platform }}" = "macos" ]; then
          # macOS生成DMG镜像
          # 清理之前的构建产物，避免资源占用
          rm -rf ./target/release/seesea-installer*.dmg
          rm -rf ./target/release/seesea-installer.app
          # 使用重试机制，解决hdiutil资源占用问题
          for i in {1..3}; do
            echo "Attempt $i of 3: Creating DMG image..."
            if cargo packager --release --manifest-path Cargo.toml --formats dmg; then
              echo "DMG creation successful!"
              break
            else
              echo "DMG creation failed, retrying in 5 seconds..."
              sleep 5
              # 再次清理，确保没有残留文件
              rm -rf ./target/release/seesea-installer*.dmg
              rm -rf ./target/release/seesea-installer.app
            fi
          done
        fi

    # Rename Windows installer
    - name: Rename Windows installer
      if: matrix.platform == 'windows'
      run: |
        # Remove dot from Python version (e.g., py3.9 -> py39)
        $PYTHON_VERSION_NO_DOT = "${{ matrix.python-version }}".Replace(".", "")
        Write-Host "Python version without dot: $PYTHON_VERSION_NO_DOT"
        
        # 检查target目录结构
        Write-Host "Listing installer/target directory structure:"
        Get-ChildItem -Path "./installer/target/" -Recurse | Select-Object -Property FullName
        
        # 查找并重命名exe安装程序，优先匹配带有setup的exe文件
        $SETUP_EXE_FILE = Get-ChildItem -Path "./installer/target/" -Filter "*setup.exe" -Recurse | Select-Object -First 1
        if ($SETUP_EXE_FILE) {
          Write-Host "Found setup exe file: $($SETUP_EXE_FILE.FullName)"
          # 获取原始文件名
          $ORIGINAL_FILENAME = $SETUP_EXE_FILE.Name
          # 替换文件名，在末尾添加_py$PYTHON_VERSION_NO_DOT
          $NEW_FILENAME = $ORIGINAL_FILENAME -replace "\.exe$", "_py$PYTHON_VERSION_NO_DOT.exe"
          Move-Item -Path "$($SETUP_EXE_FILE.FullName)" -Destination "./building/$NEW_FILENAME"
          Write-Host "Renamed to: ./building/$NEW_FILENAME"
        } else {
          # 如果没有找到setup.exe，查找其他exe文件
          $ALL_EXE_FILES = Get-ChildItem -Path "./installer/target/" -Filter "*.exe" -Recurse
          Write-Host "Found exe files: $($ALL_EXE_FILES.Count)"
          $EXE_FILE = $ALL_EXE_FILES | Select-Object -First 1
          if ($EXE_FILE) {
            Write-Host "Found exe file: $($EXE_FILE.FullName)"
            # 获取原始文件名
            $ORIGINAL_FILENAME = $EXE_FILE.Name
            # 替换文件名，在末尾添加_py$PYTHON_VERSION_NO_DOT
            $NEW_FILENAME = $ORIGINAL_FILENAME -replace "\.exe$", "_py$PYTHON_VERSION_NO_DOT.exe"
            Move-Item -Path "$($EXE_FILE.FullName)" -Destination "./building/$NEW_FILENAME"
            Write-Host "Renamed to: ./building/$NEW_FILENAME"
          } else {
            Write-Host "No exe files found in installer/target directory"
          }
        }

    # Rename Linux installer
    - name: Rename Linux installer
      if: matrix.platform == 'linux'
      run: |
        # Remove dot from Python version (e.g., py3.9 -> py39)
        PYTHON_VERSION_NO_DOT=$(echo "${{ matrix.python-version }}" | tr -d '.')
        echo "Python version without dot: $PYTHON_VERSION_NO_DOT"
        
        # 检查target目录结构
        echo "Listing installer/target directory structure:"
        find ./installer/target/ -type f | sort
        
        # 查找并重命名deb包
        DEB_FILE=$(find ./installer/target/ -name "*.deb" | head -1)
        if [ -n "$DEB_FILE" ]; then
          echo "Found deb file: $DEB_FILE"
          # 获取原始文件名，提取版本号
          ORIGINAL_FILENAME=$(basename "$DEB_FILE")
          # 替换文件名，在末尾添加_py$PYTHON_VERSION_NO_DOT
          NEW_FILENAME=$(echo "$ORIGINAL_FILENAME" | sed "s/\.deb$/_py$PYTHON_VERSION_NO_DOT.deb/")
          mv "$DEB_FILE" "./building/$NEW_FILENAME"
          echo "Renamed to: ./building/$NEW_FILENAME"
        else
          echo "No deb files found in installer/target directory"
        fi

    # Rename macOS installer
    - name: Rename macOS installer
      if: matrix.platform == 'macos'
      run: |
        # Remove dot from Python version (e.g., py3.9 -> py39)
        PYTHON_VERSION_NO_DOT=$(echo "${{ matrix.python-version }}" | tr -d '.')
        echo "Python version without dot: $PYTHON_VERSION_NO_DOT"
        
        # 检查target目录结构
        echo "Listing installer/target directory structure:"
        find ./installer/target/ -type f | sort
        
        # 查找并重命名dmg镜像
        DMG_FILE=$(find ./installer/target/ -name "*.dmg" | head -1)
        if [ -n "$DMG_FILE" ]; then
          echo "Found dmg file: $DMG_FILE"
          # 获取原始文件名，提取版本号
          ORIGINAL_FILENAME=$(basename "$DMG_FILE")
          # 替换文件名，在末尾添加_py$PYTHON_VERSION_NO_DOT
          NEW_FILENAME=$(echo "$ORIGINAL_FILENAME" | sed "s/\.dmg$/_py$PYTHON_VERSION_NO_DOT.dmg/")
          mv "$DMG_FILE" "./building/$NEW_FILENAME"
          echo "Renamed to: ./building/$NEW_FILENAME"
        else
          echo "No dmg files found in installer/target directory"
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: seesea-${{ matrix.platform }}-${{ matrix.arch }}-py${{ matrix.python-version }}
        path: building/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: building

    - name: List Release Files
      run: ls -la building/**/*

    - name: Move Files to Root of Building Directory
      run: |
        # 移动所有子目录中的文件到building根目录
        for dir in building/*; do
          if [ -d "$dir" ]; then
            mv "$dir"/* building/
            rmdir "$dir"
          fi
        done
        ls -la building/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          building/*.exe
          building/*.dmg
          building/*.deb
          building/*.whl
          building/*.toml
        draft: false
        prerelease: false
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Rust Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Run Clippy
      run: |
        # 直接在主目录运行 clippy，不使用工作区
        cargo clippy --manifest-path Cargo.toml -- -D warnings

    - name: Run Rustfmt
      run: |
        # 直接在主目录运行 rustfmt，不使用工作区
        cargo fmt --manifest-path Cargo.toml --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run Security Audit
      run: |
        # 直接在主目录运行 audit，不使用工作区
        # 忽略未维护的crate警告，只关注安全漏洞
        cargo audit --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2025-0119

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy
        # Install type stubs for better mypy checking
        pip install types-requests types-openpyxl types-xlrd types-defusedxml
        # Install numpy for vector operations
        pip install numpy

    - name: Run Black
      working-directory: ./seesea
      run: black --check .

    - name: Run Ruff
      working-directory: ./seesea
      run: ruff check .

    - name: Run Mypy
      working-directory: ./seesea
      run: mypy .
