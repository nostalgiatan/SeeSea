name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
          - os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        target: ${{ matrix.target }}

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build SeeSea Core
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build Installer
      run: cargo build --release --target ${{ matrix.target }} -p seesea-installer

    - name: Run Tests
      run: cargo test --target ${{ matrix.target }}

    - name: Prepare Release Artifacts
      shell: bash
      run: |
        mkdir -p release
        if [ "${{ matrix.platform }}" = "windows" ]; then
          cp target/${{ matrix.target }}/release/seesea-installer.exe release/seesea-installer-${{ matrix.platform }}-${{ matrix.arch }}.exe
          cp target/${{ matrix.target }}/release/SeeSea.exe release/seesea-${{ matrix.platform }}-${{ matrix.arch }}.exe
        else
          cp target/${{ matrix.target }}/release/seesea-installer release/seesea-installer-${{ matrix.platform }}-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/SeeSea release/seesea-${{ matrix.platform }}-${{ matrix.arch }}
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: seesea-${{ matrix.platform }}-${{ matrix.arch }}
        path: release/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release

    - name: List Release Files
      run: ls -la release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/**/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Rust Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Run Clippy
      run: cargo clippy -- -D warnings

    - name: Run Rustfmt
      run: cargo fmt --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run Security Audit
      run: cargo audit
