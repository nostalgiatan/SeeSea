name: CI/CD Pipeline

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.platform }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x64 builds for Python 3.10-3.14
          - os: ubuntu-latest
            platform: linux
            arch: x64
            maturin-target: x86_64-unknown-linux-gnu
            python-version: '3.10'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            maturin-target: x86_64-unknown-linux-gnu
            python-version: '3.11'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            maturin-target: x86_64-unknown-linux-gnu
            python-version: '3.12'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            maturin-target: x86_64-unknown-linux-gnu
            python-version: '3.13'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            maturin-target: x86_64-unknown-linux-gnu
            python-version: '3.14'
          # Linux arm64 builds for Python 3.10-3.14
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            maturin-target: aarch64-unknown-linux-gnu
            python-version: '3.10'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            maturin-target: aarch64-unknown-linux-gnu
            python-version: '3.11'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            maturin-target: aarch64-unknown-linux-gnu
            python-version: '3.12'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            maturin-target: aarch64-unknown-linux-gnu
            python-version: '3.13'
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            maturin-target: aarch64-unknown-linux-gnu
            python-version: '3.14'
          # Linux armv7 builds for Python 3.10-3.14
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            maturin-target: armv7-unknown-linux-gnueabihf
            python-version: '3.10'
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            maturin-target: armv7-unknown-linux-gnueabihf
            python-version: '3.11'
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            maturin-target: armv7-unknown-linux-gnueabihf
            python-version: '3.12'
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            maturin-target: armv7-unknown-linux-gnueabihf
            python-version: '3.13'
          - os: ubuntu-latest
            platform: linux
            arch: armv7
            maturin-target: armv7-unknown-linux-gnueabihf
            python-version: '3.14'
          # Windows x64 builds for Python 3.10-3.14
          - os: windows-latest
            platform: windows
            arch: x64
            maturin-target: x86_64-pc-windows-msvc
            python-version: '3.10'
          - os: windows-latest
            platform: windows
            arch: x64
            maturin-target: x86_64-pc-windows-msvc
            python-version: '3.11'
          - os: windows-latest
            platform: windows
            arch: x64
            maturin-target: x86_64-pc-windows-msvc
            python-version: '3.12'
          - os: windows-latest
            platform: windows
            arch: x64
            maturin-target: x86_64-pc-windows-msvc
            python-version: '3.13'
          - os: windows-latest
            platform: windows
            arch: x64
            maturin-target: x86_64-pc-windows-msvc
            python-version: '3.14'
          # Windows arm64 builds for Python 3.10-3.14
          - os: windows-latest
            platform: windows
            arch: arm64
            maturin-target: aarch64-pc-windows-msvc
            python-version: '3.10'
          - os: windows-latest
            platform: windows
            arch: arm64
            maturin-target: aarch64-pc-windows-msvc
            python-version: '3.11'
          - os: windows-latest
            platform: windows
            arch: arm64
            maturin-target: aarch64-pc-windows-msvc
            python-version: '3.12'
          - os: windows-latest
            platform: windows
            arch: arm64
            maturin-target: aarch64-pc-windows-msvc
            python-version: '3.13'
          - os: windows-latest
            platform: windows
            arch: arm64
            maturin-target: aarch64-pc-windows-msvc
            python-version: '3.14'
          # macOS x64 builds for Python 3.10-3.14
          - os: macos-latest
            platform: macos
            arch: x64
            maturin-target: x86_64-apple-darwin
            python-version: '3.10'
          - os: macos-latest
            platform: macos
            arch: x64
            maturin-target: x86_64-apple-darwin
            python-version: '3.11'
          - os: macos-latest
            platform: macos
            arch: x64
            maturin-target: x86_64-apple-darwin
            python-version: '3.12'
          - os: macos-latest
            platform: macos
            arch: x64
            maturin-target: x86_64-apple-darwin
            python-version: '3.13'
          - os: macos-latest
            platform: macos
            arch: x64
            maturin-target: x86_64-apple-darwin
            python-version: '3.14'
          # macOS arm64 builds for Python 3.10-3.14
          - os: macos-latest
            platform: macos
            arch: arm64
            maturin-target: aarch64-apple-darwin
            python-version: '3.10'
          - os: macos-latest
            platform: macos
            arch: arm64
            maturin-target: aarch64-apple-darwin
            python-version: '3.11'
          - os: macos-latest
            platform: macos
            arch: arm64
            maturin-target: aarch64-apple-darwin
            python-version: '3.12'
          - os: macos-latest
            platform: macos
            arch: arm64
            maturin-target: aarch64-apple-darwin
            python-version: '3.13'
          - os: macos-latest
            platform: macos
            arch: arm64
            maturin-target: aarch64-apple-darwin
            python-version: '3.14'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.maturin-target }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin setuptools wheel build

    - name: Build seesea-core with maturin
      shell: bash
      run: |
        # 为特定目标架构构建
        maturin build --release --strip
        mkdir -p building
        cp target/wheels/*.whl building/ 2>/dev/null || cp target/wheels/*.whl building/

    - name: Build seesea Python package
      working-directory: ./seesea
      shell: bash
      run: |
        python -m pip install -e .
        python -m build --wheel
        cp dist/*.whl ../building/

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install zstandard astor

    - name: Generate installation scripts
      run: |
        python build.py

    - name: List generated files
      shell: bash
      run: ls -la building/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: seesea-${{ matrix.platform }}-${{ matrix.arch }}-py${{ matrix.python-version }}-${{ github.run_id }}
        path: building/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: false

    - name: Collect All Build Files
      run: |
        mkdir -p building
        # 复制所有平台的产物到 building 目录
        find artifacts -name "*.whl" -exec cp {} building/ \;
        find artifacts -name "*.py" -exec cp {} building/ \;
        # 去重（不同平台可能有相同的 seesea-*.whl 文件）
        cd building
        # 列出所有文件
        echo "=== All collected files ==="
        ls -la

    - name: List Release Files
      run: |
        echo "=== Files to be released ==="
        ls -la building/

    - name: Install build dependencies for generating seesea-up.py
      run: |
        python -m pip install --upgrade pip
        pip install zstandard jinja2

    - name: Generate seesea-up.py with actual platform information
      run: |
        python build.py -up
        ls -la building/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          building/*.whl
          building/*.py
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Rust Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Run Clippy
      run: |
        cargo clippy --manifest-path Cargo.toml -- -D warnings

    - name: Run Rustfmt
      run: |
        cargo fmt --manifest-path Cargo.toml --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run Security Audit
      run: |
        cargo audit --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2025-0119

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy
        pip install types-requests types-openpyxl types-xlrd types-defusedxml
        pip install numpy

    - name: Run Black
      working-directory: ./seesea
      run: black --check .

    - name: Run Ruff
      working-directory: ./seesea
      run: ruff check .

    - name: Run Mypy
      working-directory: ./seesea
      run: mypy .
