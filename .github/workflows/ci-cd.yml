name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: seesea-core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: seesea-core
      - name: Format
        run: cargo fmt -p seesea-pipeline -p seesea-mcp -p seesea-cli -p seesea-fetch -- --check
      - name: Test
        run: cargo test -p seesea-pipeline -p seesea-mcp -p seesea-cli -p seesea-fetch -p seesea-extract

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: seesea-core
      - run: cargo build --release -p seesea-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: seesea-${{ matrix.target }}
          path: |
            seesea-core/target/${{ matrix.target }}/release/seesea
            seesea-core/target/${{ matrix.target }}/release/seesea.exe
          if-no-files-found: ignore
