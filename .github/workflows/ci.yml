name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The crates that make up the data center. The older crates in the workspace are not checked here.
# CORE is the list of `-p` flags the jobs below share.
jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seesea-core
    env:
      CORE: -p seesea-pipeline -p seesea-mcp -p seesea-cli -p seesea-fetch -p seesea-extract -p seesea-auth -p seesea-index -p seesea-embed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: seesea-core
      - name: Format
        run: cargo fmt $CORE -- --check
      # The end-to-end tests in seesea-cli start real servers on loopback and a fake search engine.
      # Tests that need the models or Lightpanda are ignored or skip themselves.
      - name: Test
        run: cargo test $CORE

  # The binary has to build on every system we ship for.
  binary:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: seesea-core
      - run: cargo build --release -p seesea-cli
        working-directory: seesea-core

  # The desktop shell is its own workspace, so it is checked apart from the core.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo check --manifest-path desktop/Cargo.toml
